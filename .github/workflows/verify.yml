name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Supporting evidence on GitHub's linux/amd64 runner. It runs the same
    # local targets as a developer: network-enabled preparation first, then the
    # complete acceptance suite in the pinned image with --network=none.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the pinned Linux image (network)
        run: make container-build
      - name: Fetch and verify the pinned Wget source (network)
        run: make prepare-demo
      - name: Run verify, test-native, test-arm, demo and dist offline in the image
        run: make test-container
      - name: Keep the log, demo evidence and release archives
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-container-evidence
          path: .cache/test-container/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
